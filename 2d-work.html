<body>

    <header>
        <div class="header-content">
            <img src="assets/profile.jpeg" alt="Milena Faro Profile" class="profile-pic">
            <h1>Milena Faro</h1>
        </div>
        <nav>
            <a href="index.html">About Me</a>

            <a href="3d-work.html">3D Work</a>
            <a href="photography.html">Photography</a>
        </nav>
    </header>

    <main>
        <section id="photography">
            <h2>2D Art</h2>

            <div>
                <h3>Green Guardians</h3>
                <div class="pinterest-grid">
                    <div class="photo-item"><img src="assets/digitalArt/green1.jpg" alt="Description"></div>
                    <div class="photo-item"><img src="assets/digitalArt/green2.jpg" alt="Description"></div>
                    <div class="photo-item"><img src="assets/digitalArt/green3.jpg" alt="Description"></div>
                    <div class="photo-item"><img src="assets/digitalArt/green4.png" alt="Description"></div>
                </div>
            </div>

            <div>
                <h3>Serra Serrada</h3>
                <div class="pinterest-grid">
                    <div class="photo-item"><img src="assets/digitalArt/serra1.png" alt="Description"></div>
                </div>
            </div>
            <div>
                <h3>Outros Trabalhos</h3>
                <div class="pinterest-grid">
                    <div class="photo-item"><img src="assets/digitalArt/serra.png" alt="Description"></div>
                </div>

    </main>

    <footer>
        <div class="social-links">
            <a href="https://daviddfaro3005.itch.io/">itch.io</a>

        <p>&copy; 2026 Milena Faro | Developed with HTML & CSS by <a href="https://gugagoncalo.github.io/GugaGoncalo.git.io">Gonçalo Oliveira</a></p>
    </footer>

    <div id="portfolioLightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-display" id="lightboxTargetImg" alt="Portfolio Preview Fullscreen">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lightbox = document.getElementById("portfolioLightbox");
            const lightboxImg = document.getElementById("lightboxTargetImg");
            const closeBtn = document.querySelector(".lightbox-close");

            // Targets all gallery views across pages: grids, items, and screenshots
            const imageTargets = document.querySelectorAll(
                '.pinterest-grid img, .game-screenshots img, .work-item img'
            );

            imageTargets.forEach(img => {
                // Change cursor pointer style to communicate clickability
                img.style.cursor = 'pointer';
                
                img.addEventListener('click', () => {
                    lightbox.style.display = "flex";
                    lightboxImg.src = img.src;
                });
            });

            // Dim out window if user clicks close button or empty overlay backdrop
            closeBtn.addEventListener('click', () => lightbox.style.display = "none");
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) lightbox.style.display = "none";
            });
        });
    </script>
</body>
</html>
