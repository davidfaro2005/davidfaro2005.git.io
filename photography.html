    <div id="portfolioLightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-display" id="lightboxTargetImg" alt="Portfolio Preview Fullscreen">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lightbox = document.getElementById("portfolioLightbox");
            const lightboxImg = document.getElementById("lightboxTargetImg");
            const closeBtn = document.querySelector(".lightbox-close");

            // Targets all gallery views across pages: grids, items, and screenshots
            const imageTargets = document.querySelectorAll(
                '.pinterest-grid img, .game-screenshots img, .work-item img'
            );

            imageTargets.forEach(img => {
                // Change cursor pointer style to communicate clickability
                img.style.cursor = 'pointer';
                
                img.addEventListener('click', () => {
                    lightbox.style.display = "flex";
                    lightboxImg.src = img.src;
                });
            });

            // Dim out window if user clicks close button or empty overlay backdrop
            closeBtn.addEventListener('click', () => lightbox.style.display = "none");
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) lightbox.style.display = "none";
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggleBtn = document.getElementById("menuToggleBtn");
            const navMenu = document.getElementById("navMenu");

            // Helper function to handle the menu opening/closing logic
            function toggleMenu(e) {
                e.preventDefault(); // Prevents iOS from firing double-clicks (ghost clicks)
                navMenu.classList.toggle("mobile-open");
            }

            // Listen for both desktop clicks AND mobile finger touches
            menuToggleBtn.addEventListener("click", toggleMenu);
            menuToggleBtn.addEventListener("touchstart", toggleMenu, { passive: false });
        });
    </script>
</body>
