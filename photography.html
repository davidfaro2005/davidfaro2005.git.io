    <div id="portfolioLightbox" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-display" id="lightboxTargetImg" alt="Portfolio Preview Fullscreen">
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const lightbox = document.getElementById("portfolioLightbox");
            const lightboxImg = document.getElementById("lightboxTargetImg");
            const closeBtn = document.querySelector(".lightbox-close");

            // Targets all gallery views across pages: grids, items, and screenshots
            const imageTargets = document.querySelectorAll(
                '.pinterest-grid img, .game-screenshots img, .work-item img'
            );

            imageTargets.forEach(img => {
                // Change cursor pointer style to communicate clickability
                img.style.cursor = 'pointer';
                
                img.addEventListener('click', () => {
                    lightbox.style.display = "flex";
                    lightboxImg.src = img.src;
                });
            });

            // Dim out window if user clicks close button or empty overlay backdrop
            closeBtn.addEventListener('click', () => lightbox.style.display = "none");
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox) lightbox.style.display = "none";
            });
        });
    </script>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const menuToggleBtn = document.getElementById('menuToggleBtn');
            const navLinks = document.getElementById('navLinks');

            function toggleMenu(e) {
                e.preventDefault(); // Lock multi-firing native device delays
                menuToggleBtn.classList.toggle('active');
                navLinks.classList.toggle('open');
            
                // If overlay drawer opens up, block layout content background scroll depth
                if (navLinks.classList.contains('open')) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'auto';
                }
            }

            // Native sync for tactile instant screens feedback mapping targets
            menuToggleBtn.addEventListener('click', toggleMenu);
            menuToggleBtn.addEventListener('touchstart', toggleMenu, { passive: false });

            // Collapse display grid layers down if a menu target hyperlink item gets selected
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    menuToggleBtn.classList.remove('active');
                    navLinks.classList.remove('open');
                    document.body.style.overflow = 'auto';
                });
            });
        });
    </script>
</body>
